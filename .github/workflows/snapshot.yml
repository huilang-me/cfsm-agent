name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure current main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Snapshot skipped because main moved."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $main_sha"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build snapshot binaries
        id: build
        run: |
          set -euo pipefail
          VERSION="Snapshot-$(date -u +%y%m%d%H%M)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build_one() {
            goos="$1"
            goarch="$2"
            suffix="$3"
            goarm="${4:-}"
            output="dist/cf-probe-${goos}-${suffix}"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${goos}/${goarch} -> ${output}"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$LDFLAGS" -o "$output" ./cmd/cf-probe
          }

          build_one linux amd64 amd64
          build_one linux arm64 arm64
          build_one linux 386 386
          build_one linux arm armv5 5
          build_one linux arm armv6 6
          build_one linux arm armv7 7
          build_one linux loong64 loong64
          build_one freebsd amd64 amd64
          build_one freebsd arm64 arm64
          build_one freebsd 386 386
          build_one freebsd arm arm
          build_one darwin amd64 amd64
          build_one darwin arm64 arm64
          build_one windows amd64 amd64
          build_one windows arm64 arm64
          build_one windows 386 386

          sha256sum dist/* > dist/checksums.txt

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$VERSION" --repo "${{ github.repository }}" --cleanup-tag --yes
          fi

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Automated snapshot build ${VERSION} from ${GITHUB_SHA}." \
            --prerelease \
            dist/*

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 1000 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("Snapshot-"))) | .tagName' |
          while IFS= read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "$VERSION" ]; then
              continue
            fi
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done

  docker-snapshot:
    name: Publish snapshot Docker image
    runs-on: ubuntu-latest
    needs: snapshot
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure current main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Snapshot Docker publish skipped because main moved."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $main_sha"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 0
          VERSION: ${{ needs.snapshot.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "${VERSION}" ]; then
            VERSION="Snapshot-${GITHUB_SHA::7}"
          fi
          LDFLAGS="-s -w -X main.version=${VERSION}"
          echo "Docker binary version: ${VERSION}"
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-amd64 ./cmd/cf-probe
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-arm64 ./cmd/cf-probe

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=snapshot

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: false
