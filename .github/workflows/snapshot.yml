name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  snapshot:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure current main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Snapshot skipped because main moved."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $main_sha"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build snapshot binaries
        id: build
        run: |
          set -euo pipefail
          VERSION="Snapshot-$(date -u +%y%m%d%H%M)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # $4 = GOARM, $5 = GOMIPS/GOMIPS64 (MIPS assets are softfloat so they
          # also run on router CPUs without an FPU)
          build_one() {
            goos="$1"
            goarch="$2"
            suffix="$3"
            goarm="${4:-}"
            gomips="${5:-}"
            output="dist/cf-probe-${goos}-${suffix}"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${goos}/${goarch} -> ${output}"
            (
              if [ -n "$goarm" ]; then
                export GOARM="$goarm"
              fi
              case "$goarch" in
                mips|mipsle)
                  if [ -n "$gomips" ]; then
                    export GOMIPS="$gomips"
                  fi
                  ;;
                mips64|mips64le)
                  if [ -n "$gomips" ]; then
                    export GOMIPS64="$gomips"
                  fi
                  ;;
              esac
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="$LDFLAGS" -o "$output" ./cmd/cf-probe
            )
          }

          build_one linux amd64 amd64
          build_one linux arm64 arm64
          build_one linux 386 386
          build_one linux arm armv5 5
          build_one linux arm armv6 6
          build_one linux arm armv7 7
          build_one linux loong64 loong64
          build_one linux mipsle mipsle "" softfloat
          build_one linux mips mips "" softfloat
          build_one linux mips64le mips64le "" softfloat
          build_one linux mips64 mips64 "" softfloat
          build_one freebsd amd64 amd64
          build_one freebsd arm64 arm64
          build_one freebsd 386 386
          build_one freebsd arm arm
          build_one darwin amd64 amd64
          build_one darwin arm64 arm64
          build_one windows amd64 amd64
          build_one windows arm64 arm64
          build_one windows 386 386

      # Go 1.21+ marks binaries as requiring Windows 10 in the PE header, which
      # makes Windows 8 / Server 2012 R2 refuse to start them ("This app can't
      # run on your PC"). Lower the header, then verify that no dependency has
      # pulled in an API missing from NT 6.2.
      - name: Make Windows binaries loadable on Server 2012 R2 / Windows 8
        run: |
          set -euo pipefail
          for bin in dist/cf-probe-windows-*.exe; do
            go run ./cmd/winsubsys -binary "$bin"
            go run ./cmd/wincompat -binary "$bin"
          done

      - name: Write checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$VERSION" --repo "${{ github.repository }}" --cleanup-tag --yes
          fi

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Automated snapshot build ${VERSION} from ${GITHUB_SHA}." \
            --prerelease \
            dist/*

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 1000 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("Snapshot-"))) | .tagName' |
          while IFS= read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "$VERSION" ]; then
              continue
            fi
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done

  docker-snapshot:
    name: Publish snapshot Docker image
    runs-on: ubuntu-latest
    needs: snapshot
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure current main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Snapshot Docker publish skipped because main moved."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $main_sha"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 0
          VERSION: ${{ needs.snapshot.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 版本号必须来自 snapshot job 的 output：镜像 tag、release tag 和二进制
          # 内嵌版本共用同一个字符串，docker job 里不再取一次时间，避免跨分钟漂移。
          if [ -z "${VERSION}" ]; then
            echo "missing snapshot version output; refusing to build an image whose tag cannot match the release" >&2
            exit 1
          fi
          LDFLAGS="-s -w -X main.version=${VERSION}"
          echo "Docker binary version: ${VERSION}"
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-amd64 ./cmd/cf-probe
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-arm64 ./cmd/cf-probe

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=snapshot
            type=raw,value=${{ needs.snapshot.outputs.version }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: false

      # 快照镜像只保留最新一份，并连带清理它的平台子 manifest，做到“推一次净增 0”。
      #
      # 删除对象必须同时满足：
      #   1. 该 version 只有一个 tag，且形如 Snapshot-<10位时间戳>；
      #   2. digest 不是本次刚推送的那个（当前镜像同时带 snapshot 标签，天然不匹配）。
      # 因此 latest / v* / sha-* / 手动标签 / 浮动 tag snapshot 都不会被删除。
      #
      # 顺序固定为「取子 digest -> 删索引 -> 删子 manifest」：先删子 manifest 会让仍被
      # tag 指向的索引短暂损坏。子 manifest 自身带 tag、或等于刚推送的 digest 时跳过。
      - name: Prune older snapshot images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${PUSHED_DIGEST}" ]; then
            echo "missing pushed image digest, skip pruning to avoid deleting the live snapshot" >&2
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          pkg="$(printf '%s' "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${IMAGE_NAME}"

          # 一次取全量版本：id、逗号分隔的 tags、digest。多 tag 的 version 其 tags 字段
          # 会带逗号，下面的“单 tag”正则因此天然把它排除。
          base=""
          versions=""
          for scope in users orgs; do
            if out="$(gh api --paginate "/${scope}/${owner}/packages/container/${pkg}/versions?per_page=100" \
                 --jq '.[] | [.id, ((.metadata.container.tags // []) | join(",")), .name] | @tsv' 2>/dev/null)"; then
              base="/${scope}/${owner}/packages/container/${pkg}"
              versions="$out"
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "container package ${pkg} not found under ${owner}, skip pruning" >&2
            exit 0
          fi

          pruned=0
          while IFS="$(printf '\t')" read -r id tags digest; do
            if [ -z "$id" ]; then
              continue
            fi
            if [ "$digest" = "${PUSHED_DIGEST}" ]; then
              echo "keep ${digest} (just pushed)"
              continue
            fi
            if [[ ! "$tags" =~ ^Snapshot-[0-9]{10}$ ]]; then
              continue
            fi

            # 先取子 digest，再删索引；取不到时只删索引，残留的子 manifest 交给人工脚本兜底。
            children=""
            if raw="$(docker buildx imagetools inspect --raw "${image}@${digest}" 2>/dev/null)"; then
              children="$(printf '%s' "$raw" | jq -r '.manifests[]?.digest' 2>/dev/null || true)"
            else
              echo "warn: cannot read manifest of ${digest}, its child manifests may stay behind" >&2
            fi

            echo "pruning snapshot index ${id} (${digest})"
            if ! gh api -X DELETE "${base}/versions/${id}"; then
              echo "failed to delete index ${id}" >&2
              continue
            fi
            pruned=$((pruned + 1))

            for child in $children; do
              if [ "$child" = "${PUSHED_DIGEST}" ]; then
                continue
              fi
              row="$(printf '%s\n' "$versions" | awk -F'\t' -v d="$child" '$3==d {print $1"\t"$2; exit}')"
              if [ -z "$row" ]; then
                echo "warn: child ${child} not listed, skip" >&2
                continue
              fi
              child_id="$(printf '%s' "$row" | cut -f1)"
              child_tags="$(printf '%s' "$row" | cut -f2)"
              if [ -n "$child_tags" ]; then
                echo "keep child ${child_id} (tagged: ${child_tags})"
                continue
              fi
              echo "pruning child manifest ${child_id} (${child})"
              gh api -X DELETE "${base}/versions/${child_id}" || echo "failed to delete child ${child_id}" >&2
            done
          done <<< "$versions"

          echo "pruned ${pruned} snapshot index(es)"
